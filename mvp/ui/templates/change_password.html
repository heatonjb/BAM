<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Change password — BAM</title>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="app">
  <div class="auth-wrap">
    <form class="auth-card" method="post" action="/account/password">
      <div class="eyebrow">◈ BAM — Account</div>
      <h1>Change password</h1>
      <div class="sub">Minimum 12 characters. Use a password manager.</div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <input type="hidden" name="_csrf" value="{{ csrf }}">

      <label for="current_password">Current password</label>
      <input id="current_password" name="current_password" type="password"
             autocomplete="current-password" required>

      <label for="new_password">New password</label>
      <input id="new_password" name="new_password" type="password"
             autocomplete="new-password" minlength="12" required>

      <label for="confirm_password">Confirm new password</label>
      <input id="confirm_password" name="confirm_password" type="password"
             autocomplete="new-password" minlength="12" required>

      <button type="submit">Update password</button>

      <div class="foot"><a href="/">← Back</a></div>
    </form>
  </div>
</body>
</html>
