<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change password — Business as a Machine</title>
    <style>
        :root { color-scheme: dark; }
        body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
               background:#0b1220; color:#e2e8f0;
               font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
        .card { width:100%; max-width:400px; padding:2rem; background:#111a2e;
                border:1px solid #1e2a44; border-radius:12px; }
        h1 { font-size:1rem; margin:0 0 0.25rem; }
        .sub { color:#64748b; font-size:0.75rem; margin-bottom:1.4rem; }
        label { display:block; font-size:0.72rem; color:#94a3b8; margin-bottom:0.35rem;
                text-transform:uppercase; letter-spacing:0.06em; }
        input { width:100%; box-sizing:border-box; padding:0.6rem 0.7rem; margin-bottom:0.9rem;
                background:#0b1220; border:1px solid #24314f; border-radius:7px;
                color:#e2e8f0; font-size:0.9rem; }
        button { width:100%; padding:0.65rem; border:0; border-radius:7px; cursor:pointer;
                 background:#2563eb; color:#fff; font-size:0.9rem; font-weight:600; }
        .flash { padding:0.6rem 0.75rem; border-radius:7px; font-size:0.8rem; margin-bottom:1rem; border:1px solid; }
        .flash.error { background:rgba(239,68,68,0.12); border-color:rgba(239,68,68,0.4); color:#fca5a5; }
        .flash.message { background:rgba(34,197,94,0.12); border-color:rgba(34,197,94,0.4); color:#86efac; }
        a { color:#60a5fa; font-size:0.78rem; text-decoration:none; }
    </style>
</head>
<body>
    <form class="card" method="post" action="/account/password">
        <h1>Change password</h1>
        <div class="sub">Minimum 12 characters. Use a password manager.</div>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}
        <input type="hidden" name="_csrf" value="{{ csrf }}">
        <label for="current_password">Current password</label>
        <input id="current_password" name="current_password" type="password" autocomplete="current-password" required>
        <label for="new_password">New password</label>
        <input id="new_password" name="new_password" type="password" autocomplete="new-password" minlength="12" required>
        <label for="confirm_password">Confirm new password</label>
        <input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" minlength="12" required>
        <button type="submit">Update password</button>
        <div style="margin-top:1rem;text-align:center;"><a href="/">← Back</a></div>
    </form>
</body>
</html>
