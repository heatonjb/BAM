<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in — Business as a Machine</title>
    <link rel="stylesheet" href="/static/base.css">
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0; min-height: 100vh; display: flex; align-items: center;
            justify-content: center; background: #0b1220;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #e2e8f0;
        }
        .card {
            width: 100%; max-width: 380px; padding: 2rem 2rem 1.6rem;
            background: #111a2e; border: 1px solid #1e2a44; border-radius: 12px;
            box-shadow: 0 12px 40px rgba(0,0,0,0.45);
        }
        h1 { font-size: 1.05rem; margin: 0 0 0.25rem; letter-spacing: 0.02em; }
        .sub { color: #64748b; font-size: 0.75rem; margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.72rem; color: #94a3b8; margin-bottom: 0.35rem;
                text-transform: uppercase; letter-spacing: 0.06em; }
        input[type=email], input[type=password] {
            width: 100%; box-sizing: border-box; padding: 0.6rem 0.7rem; margin-bottom: 1rem;
            background: #0b1220; border: 1px solid #24314f; border-radius: 7px;
            color: #e2e8f0; font-size: 0.9rem;
        }
        input:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        button {
            width: 100%; padding: 0.65rem; border: 0; border-radius: 7px; cursor: pointer;
            background: #2563eb; color: #fff; font-size: 0.9rem; font-weight: 600;
        }
        button:hover { background: #1d4ed8; }
        .flash { padding: 0.6rem 0.75rem; border-radius: 7px; font-size: 0.8rem;
                 margin-bottom: 1rem; border: 1px solid; }
        .flash.error { background: rgba(239,68,68,0.12); border-color: rgba(239,68,68,0.4); color: #fca5a5; }
        .flash.message { background: rgba(34,197,94,0.12); border-color: rgba(34,197,94,0.4); color: #86efac; }
        .foot { margin-top: 1.4rem; font-size: 0.68rem; color: #475569; text-align: center; }
    </style>
</head>
<body>
    <form class="card" method="post" action="/login">
        <h1>⚙️ Business as a Machine</h1>
        <div class="sub">Sign in to view your business</div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <input type="hidden" name="_csrf" value="{{ csrf }}">
        <input type="hidden" name="next" value="{{ next or '' }}">

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="username"
               required autofocus value="{{ request.form.get('email', '') }}">

        <label for="password">Password</label>
        <input id="password" name="password" type="password" autocomplete="current-password"
               required minlength="12">

        <button type="submit">Sign in</button>

        <div class="foot">Authorised access only. Activity is logged.</div>
    </form>
</body>
</html>
