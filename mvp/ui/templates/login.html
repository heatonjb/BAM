<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — BAM</title>
  <link rel="stylesheet" href="/static/base.css">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body class="app">
  <div class="auth-wrap">
    <form class="auth-card" method="post" action="/login">
      <div class="eyebrow">◈ BAM — Business as a Machine</div>
      <h1>Sign in</h1>
      <div class="sub">View and change your business model.</div>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}

      <input type="hidden" name="_csrf" value="{{ csrf }}">
      <input type="hidden" name="next" value="{{ next or '' }}">

      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username"
             required autofocus value="{{ request.form.get('email', '') }}">

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
             required minlength="12">

      <button type="submit">Sign in</button>

      <div class="foot">Authorised access only. Activity is logged.</div>
    </form>
  </div>
</body>
</html>
